; QRNGabri – ESP32-S3 PlatformIO Configuration
; Based on radon project platformio.ini
; Entropy source: RadonEye RD200V2 over BLE (C-pulse slow-clock method)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_port  = /dev/cu.usbmodem59090340211
upload_port   = /dev/cu.usbmodem59090340211
; CH343 on macOS's built-in driver corrupts large transfers: skip the stub and
; write 256-byte blocks (tools/esptool_small_blocks.py). With the WCH driver
; installed, drop these three lines and go back to 921600.
upload_speed  = 460800
upload_flags  = --no-stub
extra_scripts = post:tools/small_block_upload.py

; LittleFS partition for config + web assets
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    ESP Async WebServer @ ^1.2.3
    ESP32 BLE Arduino
