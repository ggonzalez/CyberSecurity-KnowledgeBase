; QRNGabri – ESP32-S3 PlatformIO Configuration
; Based on radon project platformio.ini
; Entropy source: RadonEye RD200V2 over BLE (C-pulse slow-clock method)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_port  = /dev/cu.wchusbserial59090340211
upload_port   = /dev/cu.wchusbserial59090340211
upload_speed  = 921600

; LittleFS partition for config + web assets
board_build.filesystem = littlefs

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    ESP Async WebServer @ ^1.2.3
    ESP32 BLE Arduino
